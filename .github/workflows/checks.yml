# Runs the checks of this repository on machines hosted by GitHub.
# What each command is and what it shows: README.md, "Check it yourself".
#
# On Linux, macOS and Windows: rustfmt, clippy and every check of the suite. Two checks,
# g2 and g3 of tests/genesis.rs, fail on purpose: they are forbidden moves that nothing on
# chain refuses (README.md, "What a launch must check"). tools/run-checks.mjs runs
# `cargo test` itself and passes only when every test file ran, every other check passed,
# and those two failed with their own message; any other result, a build error included,
# fails the step. Nothing in this file lets a failed command pass.
#
# On Linux only: the replay of every judged transaction on the rusty-kaspa 2.1.0 packages
# (engine-2.1.0/), from the transactions the checks write in the same job. On Windows the
# replay crate does not build as published: the kaspa-hashes 2.1.0 package on crates.io
# lacks keccakf1600_x86-64-msvc.asm. It is not run on macOS, to keep the run short.
#
# On Linux, macOS and Windows as well, the programs of the testnet-10 run (testnet/README.md):
# the self-tests of the builder (made-up keys) and the verifier; the verifier on the chain
# files of the runs of 2026-10-15 and 2026-10-30, whose reports must be the ones kept next to
# the records byte for byte, and the builder's judging of those files; in a job of its own,
# the tests of the sender, its check of those chain files, and the three checksums each record
# names.
#
# Not run here: the mutation run of tools/mutation-run.mjs, which builds and runs the honest
# and forbidden cases 31 times (the time of its last run: results/mutation-run.txt); the
# builder with real keys; and the sender's prepare, send and status, which ask a public node.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    env:
      # The build leaves out debug information and incremental data, to take less room on
      # the disk of a hosted machine. No command and no check depends on either.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone the reference at the revision the checks were written against
        run: |
          git clone -c core.autocrlf=false https://github.com/argent-lang/kcc20-reference
          git -C kcc20-reference checkout c8a087117735a1f87c5c6d115fcddeaf2562c784

      - name: The Rust toolchain that rust-toolchain.toml names
        run: |
          rustup --version
          rustup toolchain install --no-self-update
          rustc --version --verbose
          cargo --version
          cargo clippy --version
          cargo fmt --version
          node --version
          df -h .

      - name: cargo fetch --locked
        run: cargo fetch --locked

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --frozen --all-targets -- -D warnings

      - name: Every check (g2 and g3 must fail, every other check must pass)
        run: |
          KCC20_REFERENCE_DIR=$(realpath kcc20-reference)
          export KCC20_REFERENCE_DIR
          export VESTING_DUMP_DIR=target/vesting-dump
          node tools/run-checks.mjs

      - name: "The builder of the testnet run: its self-test with made-up keys"
        run: |
          KCC20_REFERENCE_DIR=$(realpath kcc20-reference)
          export KCC20_REFERENCE_DIR
          cargo test --frozen --test testnet_chain

      - name: "The verifier of the testnet run: its self-test on changed files"
        run: |
          KCC20_REFERENCE_DIR=$(realpath kcc20-reference)
          export KCC20_REFERENCE_DIR
          cargo test --frozen --test testnet_verify

      - name: "The records of the testnet runs: every lock computed again, the same report"
        run: |
          KCC20_REFERENCE_DIR=$(realpath kcc20-reference)
          export KCC20_REFERENCE_DIR
          export VESTING_VERIFY_REPORT=target/verify-of-the-run.json
          for report in 2026-10-15-testnet-10/verify-format-2.json 2026-10-30-testnet-10/verify.json; do
            rm -f "$VESTING_VERIFY_REPORT"
            VESTING_VERIFY_CHAIN="testnet/results/$(dirname "$report")/chain.json" cargo test --frozen --test testnet_verify
            cmp "$VESTING_VERIFY_REPORT" "testnet/results/$report"
          done

      - name: "The records of the testnet runs: every transaction judged again from the file"
        run: |
          KCC20_REFERENCE_DIR=$(realpath kcc20-reference)
          export KCC20_REFERENCE_DIR
          for run in 2026-10-15-testnet-10 2026-10-30-testnet-10; do
            VESTING_JUDGE_CHAIN="testnet/results/$run/chain.json" cargo test --frozen --test testnet_chain
          done

      - name: "The replay on 2.1.0: cargo fetch --locked"
        if: runner.os == 'Linux'
        working-directory: engine-2.1.0
        run: cargo fetch --locked

      - name: "The replay on 2.1.0: cargo fmt --check"
        if: runner.os == 'Linux'
        working-directory: engine-2.1.0
        run: cargo fmt --check

      - name: "The replay on 2.1.0: cargo clippy"
        if: runner.os == 'Linux'
        working-directory: engine-2.1.0
        run: cargo clippy --frozen --all-targets -- -D warnings

      - name: "The replay on 2.1.0: every judged transaction"
        if: runner.os == 'Linux'
        working-directory: engine-2.1.0
        run: |
          cargo run --frozen --release -- ../target/vesting-dump/cases.jsonl | tee replay.log
          grep -F "209 transactions: 209 judged the same on 2.1.0, 0 differently" replay.log
          rm replay.log

      - name: Room taken by the build
        if: always()
        run: |
          if [ -d target ]; then du -sh target; fi
          if [ -d engine-2.1.0/target ]; then du -sh engine-2.1.0/target; fi
          df -h .

  testnet:
    name: testnet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned Kaspa SDK
        run: |
          python --version
          python -m pip --version
          python -m pip install --require-hashes -r requirements.txt

      - name: Tests of the sender
        working-directory: testnet
        run: python -m unittest discover -s tests

      - name: The chain files of the runs, by the sender's rules
        working-directory: testnet
        run: |
          for report in 2026-10-15-testnet-10/verify-format-2.json 2026-10-30-testnet-10/verify.json; do
            python vesting_send.py check "results/$(dirname "$report")/chain.json" \
              --party payer=kaspatest:qr9qu3z2cfv03506hxwct55hz00acg0wynz2c733cnhy0t9v0d4kg8gzyrlea \
              --party alice=kaspatest:qpqhsayjhjz8846pr3cxxc4gfnpdawhn3cvlht3xyyqt839u3xnzy3v7q4ckw \
              --party beneficiary=kaspatest:qp744ct30vpv0cwhzx3k484wqmxq6jzdq6e44suppnfx9y4zaldzynqsn2asf \
              --verify-report "results/$report"
          done

      - name: The three checksums each record of a run names
        working-directory: testnet
        run: |
          python - <<'EOF'
          import glob, hashlib, json, sys
          bad = 0
          # When testnet/vesting_send.py changes, first keep this copy next to the record, as for
          # the run of 2026-10-15, and name it here.
          for run, program in (
              ("results/2026-10-15-testnet-10", "results/2026-10-15-testnet-10/vesting_send.py"),
              ("results/2026-10-30-testnet-10", "vesting_send.py"),
          ):
              (record,) = glob.glob(run + "/record/run-*Z.jsonl")
              with open(record, encoding="utf-8") as lines:
                  first = json.loads(lines.readline())
              for want, name in (
                  (first["chain_sha256"], run + "/chain.json"),
                  (first["verify_report_sha256"], run + "/verify.json"),
                  (first["program_sha256"], program),
              ):
                  with open(name, "rb") as file:
                      have = hashlib.sha256(file.read()).hexdigest()
                  print(name, have, "ok" if have == want else "DIFFERENT, the record names " + want)
                  bad += have != want
          sys.exit(1 if bad else 0)
          EOF
